<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Validación</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .form-title {
            font-weight: 600;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-label {
            color: #fff;
            font-weight: 500;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control.is-invalid {
            border: 1px solid #ff6b6b;
        }

        .invalid-feedback {
            color: #ff9999;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            padding: 0.75rem;
        }

        .alert-success {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            border-radius: 8px;
            color: white;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h2 class="form-title">Formulario de Validación</h2>
        <form method="POST" novalidate>
            {% csrf_token %}
        <!-- Nombre -->
<div class="mb-3">
    <label class="form-label">Nombre completo</label>
    <input type="text" name="nombre" 
           class="form-control {% if errores.nombre %}is-invalid{% endif %}" 
           placeholder="Nombre"
           value="{% if errores %}{{ request.POST.nombre }}{% endif %}">
    {% if errores.nombre %}
        <div class="invalid-feedback">{{ errores.nombre }}</div>
    {% endif %}
</div>

<!-- Correo -->
<div class="mb-3">
    <label class="form-label">Correo electrónico</label>
    <input type="email" name="correo" 
           class="form-control {% if errores.correo %}is-invalid{% endif %}" 
           placeholder="Correo electrónico"
           value="{% if errores %}{{ request.POST.correo }}{% endif %}">
    {% if errores.correo %}
        <div class="invalid-feedback">{{ errores.correo }}</div>
    {% endif %}
</div>

<!-- Teléfono -->
<div class="mb-3">
    <label class="form-label">Número de teléfono</label>
    <input type="tel" name="telefono" 
           class="form-control {% if errores.telefono %}is-invalid{% endif %}" 
           placeholder="Teléfono"
           value="{% if errores %}{{ request.POST.telefono }}{% endif %}">
    {% if errores.telefono %}
        <div class="invalid-feedback">{{ errores.telefono }}</div>
    {% endif %}
</div>

            <button type="submit" class="btn btn-primary w-100">Validar información</button>
        </form>
        
        {% if mensaje %}
            <div class="alert alert-success mt-3">
                <strong>¡Éxito!</strong> {{ mensaje }}
            </div>
        {% endif %}
    </div>
</body>
</html>
